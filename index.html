<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>エモチップ デモ</title>
<style>
:root{--bg:#EEF2F6;--sheet:#fff;--fg:#17202A;--muted:#5C6B7A;--line:#DDE5EC;--chip:#8A6214;--chip-bg:#FAF1DC;--minus:#A33A2A;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#10151A;--sheet:#1A212A;--fg:#E7EDF3;--muted:#9AA8B6;--line:#2D3842;--chip:#E0BE6E;--chip-bg:#2A2416;--minus:#DD8073;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
 padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
form{background:var(--sheet);border:1px solid var(--line);border-radius:18px;padding:28px 22px;max-width:380px;width:100%;display:grid;gap:12px;box-shadow:0 10px 40px rgba(16,28,40,.12)}
h1{margin:0;font-size:1.3rem}
h1 span{display:block;font-size:.8rem;color:var(--muted);font-weight:500;margin-top:4px}
label{font-size:.85rem;font-weight:700;color:var(--muted)}
input[type=password],input[type=text]{width:100%;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
.row{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted)}
button{font-size:1rem;font-weight:700;padding:12px;border:0;border-radius:10px;background:var(--fg);color:var(--sheet);cursor:pointer;min-height:46px}
button:disabled{opacity:.5}
.err{color:var(--minus);font-size:.85rem;font-weight:700;min-height:1.2em;margin:0}
</style>
</head>
<body>
<form id="f">
 <h1>エモチップ デモ<span>見るには、パスワードを入れてください</span></h1>
 <label for="pw">パスワード</label>
 <input id="pw" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" required>
 <label class="row"><input type="checkbox" id="show"> パスワードを表示する</label>
 <label class="row"><input type="checkbox" id="keep"> この端末でおぼえる</label>
 <button id="go" type="submit">ひらく</button>
 <p class="err" id="err" role="alert"></p>
</form>
